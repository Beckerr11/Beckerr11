<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc">
  <title id="title">Atividade pública recente de Douglas Silva no GitHub</title>
  <desc id="desc">Linha do tempo com melhorias recentes em projetos públicos e no perfil GitHub.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="998" height="328" rx="18" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>
  <rect x="28" y="28" width="8" height="42" rx="4" fill="url(#line)"/>
  <text x="52" y="49" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24" font-weight="700">Atividade recente</text>
  <text x="52" y="70" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13">eventos públicos selecionados do histórico recente</text>

  <line x1="74" y1="105" x2="74" y2="285" stroke="url(#line)" stroke-width="3"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <circle cx="74" cy="116" r="7" fill="#58a6ff" stroke="#0d1117" stroke-width="3"/>
    <text x="100" y="111" fill="#58a6ff" font-size="12" font-weight="700">26 AGO 2026</text>
    <text x="100" y="132" fill="#f0f6fc" font-size="15" font-weight="600">URL Shortener API restaurada e validada por CI</text>
    <text x="100" y="150" fill="#8b949e" font-size="12">implementação Express verificável, testes, hygiene e Node 24</text>

    <circle cx="74" cy="171" r="7" fill="#a371f7" stroke="#0d1117" stroke-width="3"/>
    <text x="100" y="166" fill="#a371f7" font-size="12" font-weight="700">26 AGO 2026</text>
    <text x="100" y="187" fill="#f0f6fc" font-size="15" font-weight="600">Perfil GitHub redesenhado para recrutamento</text>
    <text x="100" y="205" fill="#8b949e" font-size="12">projetos selecionados, narrativa técnica e evidência verificável</text>

    <circle cx="74" cy="226" r="7" fill="#3fb950" stroke="#0d1117" stroke-width="3"/>
    <text x="100" y="221" fill="#3fb950" font-size="12" font-weight="700">26 AGO 2026</text>
    <text x="100" y="242" fill="#f0f6fc" font-size="15" font-weight="600">MasterScanner-Forense ganhou documentação profissional</text>
    <text x="100" y="260" fill="#8b949e" font-size="12">escopo defensivo, limitações, instalação e hygiene de artefatos</text>

    <circle cx="74" cy="281" r="7" fill="#d29922" stroke="#0d1117" stroke-width="3"/>
    <text x="100" y="276" fill="#d29922" font-size="12" font-weight="700">26 JUL 2026</text>
    <text x="100" y="297" fill="#f0f6fc" font-size="15" font-weight="600">SaaS Auth Dashboard finalizado como showcase verificável</text>
    <text x="100" y="315" fill="#8b949e" font-size="12">demo pública com escopo técnico descrito sem alegações não comprovadas</text>
  </g>
</svg>
