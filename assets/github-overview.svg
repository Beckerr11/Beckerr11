<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270" role="img" aria-labelledby="title desc">
  <title id="title">GitHub overview de Douglas Silva</title>
  <desc id="desc">Resumo do portfólio com 39 repositórios, 32 públicos e 7 privados.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="998" height="268" rx="18" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>
  <rect x="28" y="28" width="8" height="42" rx="4" fill="url(#accent)"/>
  <text x="52" y="49" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24" font-weight="700">GitHub Overview</text>
  <text x="52" y="70" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13">portfólio técnico e atividade de desenvolvimento</text>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect x="28" y="98" width="214" height="118" rx="14" fill="#161b22" stroke="#30363d"/>
    <text x="48" y="132" fill="#8b949e" font-size="13">REPOSITÓRIOS</text>
    <text x="48" y="179" fill="#f0f6fc" font-size="42" font-weight="700">39</text>
    <text x="48" y="201" fill="#58a6ff" font-size="12">ecossistema completo</text>

    <rect x="258" y="98" width="214" height="118" rx="14" fill="#161b22" stroke="#30363d"/>
    <text x="278" y="132" fill="#8b949e" font-size="13">PÚBLICOS</text>
    <text x="278" y="179" fill="#f0f6fc" font-size="42" font-weight="700">32</text>
    <text x="278" y="201" fill="#3fb950" font-size="12">visíveis para recrutadores</text>

    <rect x="488" y="98" width="214" height="118" rx="14" fill="#161b22" stroke="#30363d"/>
    <text x="508" y="132" fill="#8b949e" font-size="13">PRIVADOS</text>
    <text x="508" y="179" fill="#f0f6fc" font-size="42" font-weight="700">7</text>
