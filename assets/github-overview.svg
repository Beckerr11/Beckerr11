    <rect x="718" y="98" width="254" height="118" rx="14" fill="#161b22" stroke="#30363d"/>
    <text x="738" y="132" fill="#8b949e" font-size="13">FOCO ATUAL</text>
    <text x="738" y="162" fill="#f0f6fc" font-size="17" font-weight="650">Full Stack + Backend</text>
    <text x="738" y="187" fill="#f0f6fc" font-size="17" font-weight="650">APIs + CI/CD</text>
