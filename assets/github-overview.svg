  <text x="52" y="257" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">Estado auditado em 26 ago 2026 · números incluem repositórios públicos e privados autorizados</text>
