name: Becker live metrics
on:
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/metrics.mjs', '.github/workflows/metrics.yml']
permissions:
  contents: write
concurrency:
  group: becker-metrics
  cancel-in-progress: false
jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect public metrics
        run: node scripts/metrics.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Publish cards
        run: |
          git config user.name 'Becker'
          git config user.email '227158876+Beckerr11@users.noreply.github.com'
          git add assets/github-overview.svg assets/github-activity.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh public GitHub metrics"
            git pull --rebase origin main
            git push
          fi
