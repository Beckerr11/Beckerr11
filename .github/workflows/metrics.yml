name: Becker account metrics
on:
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/metrics.mjs', '.github/workflows/metrics.yml']
  pull_request:
    types: [closed]
  issues:
    types: [opened, closed, reopened]
permissions:
  contents: write
concurrency:
  group: becker-metrics
  cancel-in-progress: false
jobs:
  metrics:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect complete account metrics
        run: node scripts/metrics.mjs
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          REQUIRE_OWNER: 'true'
      - name: Publish aggregate cards
        run: |
          git config user.name 'Becker'
          git config user.email '227158876+Beckerr11@users.noreply.github.com'
          git add assets/github-overview.svg assets/github-details.svg assets/github-activity.svg assets/metrics.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh account metric aggregates"
            git pull --rebase origin main
            git push
          fi
